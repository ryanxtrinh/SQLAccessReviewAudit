name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -d build src/main/java/audit/*.java
      - name: Run audit
        run: java -cp "build:lib/*" audit.AuditRunner
      - name: Verify against answer key
        run: java -cp "build:lib/*" audit.Verify
